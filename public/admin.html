    const isOriginWorker = window.location.hostname.includes("workers.dev");
    const primaryOrigin = isOriginWorker ? window.location.origin : CF_NODES[0];
    const candidateUrls = isOriginWorker 
      ? [primaryOrigin + path, ...CF_NODES.map(n => n + path)]
      : CF_NODES.map(n => n + path);
    
    for (const url of candidateUrls) {
      try {
        const resp = await fetch(url, options);
        if (resp.ok) return await resp.json();
      } catch (_) {}
    }
    return null;
  }, []);

  const haptic = (style = "light") => {
    if (tg && tg.HapticFeedback) {
      try {
        if (style === "success") tg.HapticFeedback.notificationOccurred("success");
        else if (style === "warning") tg.HapticFeedback.notificationOccurred("warning");
        else if (style === "error") tg.HapticFeedback.notificationOccurred("error");
        else tg.HapticFeedback.impactOccurred(style);
      } catch (_) {}
    }
  };

  };

  // Primary Data Sync
  const fetchStatus = useCallback(async (isManual = false) => {
    if (isManual) {
      setSyncing(true);
      haptic("medium");
    }
    try {
      const [resLive, resRates, resPayouts] = await Promise.all([
        fetchMeshApi("/api/fleet/live"),
        fetchMeshApi("/api/rates"),
        fetchMeshApi("/api/payouts")
      ]);
      if (resLive) {
        if (resLive.accounts && resLive.accounts.length > 0) {
          // Merge with KNOWN_PHONES_BY_INDEX fallback
          const merged = resLive.accounts.map((a, idx) => ({
            ...a,
            phone: a.phone || KNOWN_PHONES_BY_INDEX[idx + 1] || KNOWN_PHONES_BY_INDEX[a.index] || ""
          }));
          setFleet(merged);
        }
        if (resLive.bnb_balance !== undefined) setBnbBalance(parseFloat(resLive.bnb_balance) || 0.000812);
      }
      if (resRates && resRates.rates) setRates(resRates.rates);

      if (isManual) showToast("Mesh cached telemetry loaded", "info");
    } finally {
      if (isManual) setSyncing(false);
      setSyncCountdown(15);

    if (e && e.preventDefault) e.preventDefault();
    const cleanPhone = phoneInput.trim();
    if (!cleanPhone || modalLoading) return;
    setModalLoading(true);
    setModalMsg("Requesting OTP verification code from Telegram MTProto...");
    haptic("medium");
    try {
      const data = await fetchMeshApi("/api/fleet/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: cleanPhone })
      });
      setModalLoading(false);
      if (data && data.ok === false) {
        setModalMsg("❌ " + (data.error || "Failed to request code. Check phone format."));

    haptic("heavy");
    try {
      const data = await fetchMeshApi("/api/fleet/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: cleanCode, phone: phoneInput.trim() })
      });
      setModalLoading(false);
      if (data && data.need_2fa) {
        setAddStep("2fa");
        setModalMsg("🔒 Two-Factor Cloud Password required. Enter it below:");
      } else if (data && data.ok) {
        setAddStep("success");
        showToast("🎉 Account Connected Successfully!", "success");
        setTimeout(() => { setIsAddModalOpen(false); fetchStatus(true); }, 2000);
      } else {
        setModalMsg("❌ " + (data?.error || "Code verification failed"));
      }
    } catch (err) {
      setModalLoading(false);
      setModalMsg("❌ " + (err.message || "Verification error"));
    }
  };

  const handleVerify2FA = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!twoFaInput.trim() || modalLoading) return;
    setModalLoading(true);
    setModalMsg("Verifying 2FA Password...");
    haptic("heavy");
    try {
      const data = await fetchMeshApi("/api/fleet/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: twoFaInput.trim(), phone: phoneInput.trim() })
      });
      setModalLoading(false);
      if (data && data.ok) {
        setAddStep("success");
        showToast("🎉 Account Connected with 2FA!", "success");
        setTimeout(() => { setIsAddModalOpen(false); fetchStatus(true); }, 2000);
      } else {
        setModalMsg("❌ " + (data?.error || "Incorrect 2FA password"));
      }
    } catch (err) {
      setModalLoading(false);
      setModalMsg("❌ " + (err.message || "2FA error"));
    }
  };

  // Filtered Fleet Accounts
  const filteredFleet = useMemo(() => {
    return fleet.filter(acc => {
      const q = fleetSearchQuery.toLowerCase().trim();
      const matchSearch = !q ||
        (acc.name || "").toLowerCase().includes(q) ||
        String(acc.user_id || "").includes(q) ||
        (acc.phone || "").includes(q);

      if (!matchSearch) return false;
      if (fleetFilter === "ready_wd") return (parseInt(acc.stones_coins) || 0) >= 500;
      return true;
    });
  }, [fleet, fleetSearchQuery, fleetFilter]);

  const bnbUsd = bnbBalance * (rates.bnb_usd || 765);
  const targetThreshold = 0.005000;
  const progressPercent = Math.min(100, Math.max(5, (bnbBalance / targetThreshold) * 100));

  return React.createElement("div", { className: "max-w-md mx-auto min-h-screen px-3.5 pt-3 pb-24" },

    toast && React.createElement("div", {
      className: `fixed top-3 left-4 right-4 z-50 py-2.5 px-4 rounded-xl text-xs font-bold text-center shadow-lg transition-all animate-slide-up flex items-center justify-center gap-2 ${
        toast.type === "error" ? "bg-red-600 text-white" : (toast.type === "info" ? "bg-blue-600 text-white" : "bg-emerald-600 text-white")
      }`
    },
      React.createElement(Icon, { name: toast.type === "error" ? "x" : "check", className: "w-4 h-4" }),
      toast.msg
    ),

    // Header Bar
    React.createElement("header", { className: "flex items-center justify-between py-2 mb-3.5 border-b border-slate-200" },
      React.createElement("div", { className: "flex items-center gap-2.5" },
        React.createElement("div", { className: "w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center font-black text-sm shadow-xs" },
          "⚡"
        ),
        React.createElement("div", null,
          React.createElement("div", { className: "flex items-center gap-1.5" },
            React.createElement("h1", { className: "font-black text-sm text-slate-900 tracking-tight" }, "MY AGY AI"),
            React.createElement("span", { className: "bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold px-1.5 py-0.2 rounded font-mono" }, "FLEET")
          ),
          React.createElement("div", { className: "flex items-center gap-1.5 text-[11px] text-emerald-600 font-medium" },
            React.createElement("span", { className: "w-2 h-2 rounded-full bg-emerald-500 animate-pulse" }),

          onClick: () => { setIsMeshModalOpen(true); testMeshNodes(); },

        },
          React.createElement(Icon, { name: "server", className: "w-3.5 h-3.5 text-blue-600" })
        ),
        React.createElement("button", {
          onClick: () => fetchStatus(true),

    // TAB 1: FLEET ACCOUNTS (14 ACCOUNTS)

        React.createElement("div", { className: "flex items-baseline gap-2 mb-1" },
          React.createElement("span", { className: "text-2xl font-black text-slate-900 tracking-tight" }, `${bnbBalance.toFixed(6)}`),
          React.createElement("span", { className: "text-sm font-bold text-slate-500" }, "BNB")
        ),
        React.createElement("div", { className: "flex items-center justify-between text-xs mb-3" },
          React.createElement("span", { className: "font-bold text-emerald-600" }, `≈ ${currencySymbol}${(bnbUsd * currencyRate).toFixed(2)} ${currency}`),

                key: pIdx,
                className: "bg-slate-50 border border-slate-200 rounded px-1.5 py-0.5 text-center text-slate-700 flex items-center justify-center gap-1"
              },
                React.createElement("span", { className: "w-1 h-1 rounded-full bg-emerald-500" }),
                React.createElement("span", { className: "truncate" }, pName)
              ))

        })
      )
    ),

    // ==========================================================
    // TAB 2: PAYOUTS & LEDGER

      React.createElement("div", { className: "flex items-center gap-1.5 mb-3 overflow-x-auto pb-1" },
        [
          { id: "all", label: "All Payouts" },
          { id: "bnb", label: "BNB / USDT" },
          { id: "arb", label: "Arbitrum" },
          { id: "ton", label: "TON / ART" }
        ].map(f => React.createElement("button", {
          key: f.id,
          onClick: () => { setLedgerFilter(f.id); haptic("light"); },
          className: `px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition cursor-pointer ${
            ledgerFilter === f.id ? "bg-slate-900 text-white" : "bg-white text-slate-600 border border-slate-200"

        }, f.label))
      ),
      React.createElement("div", { className: "space-y-2" },
        (payouts || []).length === 0 ? React.createElement("div", { className: "pro-card rounded-xl p-8 text-center text-slate-400 text-xs" },
          "No payout receipts recorded yet."
        ) : payouts.map((p, idx) => React.createElement("div", { key: p.tx_hash || idx, className: "pro-card rounded-xl p-3 flex items-center justify-between" },
          React.createElement("div", null,
            React.createElement("div", { className: "font-black text-xs text-slate-900" }, `${p.amount || 0} ${p.token || 'BNB'}`),
            React.createElement("div", { className: "text-[10px] font-mono text-slate-400" }, p.timestamp ? new Date(p.timestamp).toLocaleString() : "Auto-Sweep")
          ),
          React.createElement("span", { className: "bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold px-2 py-0.5 rounded-full" }, "Success")
        ))
      )
    ),

    // ==========================================================
    // TAB 3: ARI AI COPILOT
    // ==========================================================
    activeTab === "ai" && React.createElement("div", { className: "animate-entrance flex flex-col h-[70vh]" },
      React.createElement("div", { className: "flex-1 overflow-y-auto space-y-2.5 p-1 mb-3" },
        aiMessages.map((m, idx) => React.createElement("div", {
          key: idx,
          className: `p-3 rounded-2xl text-xs max-w-[85%] leading-relaxed ${
            m.sender === "ai" ? "bg-white border border-slate-200 text-slate-800 shadow-2xs self-start" : "bg-blue-600 text-white font-medium self-end ml-auto"
          }`
        }, m.text)),
        aiLoading && React.createElement("div", { className: "p-3 rounded-2xl bg-white border border-slate-200 text-slate-400 text-xs animate-pulse" }, "Ari AI is thinking..."),
        React.createElement("div", { ref: messagesEndRef })
      ),
      React.createElement("div", { className: "flex items-center gap-1.5" },
        React.createElement("input", {
          type: "text",
          value: aiInput,
          onChange: (e) => setAiInput(e.target.value),
          onKeyDown: (e) => {
            if (e.key === "Enter" && aiInput.trim()) {
              setAiMessages(prev => [...prev, { sender: "user", text: aiInput.trim() }, { sender: "ai", text: "Fleet status: All 14 accounts active across 5 edge nodes. Automated claims running every 15 minutes." }]);
              setAiInput("");
            }
          },
          placeholder: "Ask Ari AI about fleet status...",
          className: "flex-1 px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs text-slate-800 outline-none shadow-2xs"
        }),
        React.createElement("button", {
          onClick: () => {
            if (aiInput.trim()) {
              setAiMessages(prev => [...prev, { sender: "user", text: aiInput.trim() }, { sender: "ai", text: "Fleet status: All 14 accounts active across 5 edge nodes. Automated claims running every 15 minutes." }]);
              setAiInput("");
            }
          },
          className: "p-2.5 bg-blue-600 text-white rounded-xl shadow-xs"
        },
          React.createElement(Icon, { name: "send", className: "w-4 h-4" })
        )
      )
    ),

    // ==========================================================
    // BOTTOM NAVIGATION DOCK
    // ==========================================================
    React.createElement("nav", { className: "fixed bottom-0 left-0 right-0 z-40 pro-dock py-2 px-6 flex items-center justify-around max-w-md mx-auto" },
      [
        { id: "fleet", label: "Fleet (14)", icon: "bot" },
        { id: "ledger", label: "Ledger", icon: "receipt" },
        { id: "ai", label: "Ari AI", icon: "sparkles" }
      ].map(tab => React.createElement("button", {
        key: tab.id,
        onClick: () => { setActiveTab(tab.id); haptic("light"); },
        className: `flex flex-col items-center gap-1 transition ${
          activeTab === tab.id ? "text-blue-600 font-bold scale-105" : "text-slate-400 hover:text-slate-600"
        }`
      },
        React.createElement(Icon, { name: tab.icon, className: "w-4 h-4" }),
        React.createElement("span", { className: "text-[10px]" }, tab.label)
      ))
    ),

    // ==========================================================
    // ADD ACCOUNT MODAL
    // ==========================================================
    isAddModalOpen && React.createElement("div", {
      className: "fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-xs p-0 sm:p-4",
      onClick: () => setIsAddModalOpen(false)
    },
      React.createElement("div", {
        className: "bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl border border-slate-200 animate-slide-up",
        onClick: (e) => e.stopPropagation()
      },
        React.createElement("div", { className: "flex items-center justify-between pb-3 mb-3 border-b border-slate-100" },
          React.createElement("h3", { className: "font-black text-sm text-slate-900" }, "Add Telegram Account to Fleet"),
          React.createElement("button", {
            onClick: () => setIsAddModalOpen(false),
            className: "w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"
          }, React.createElement(Icon, { name: "x", className: "w-4 h-4" }))
        ),

        modalMsg && React.createElement("div", { className: "p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-700 mb-3 font-medium" }, modalMsg),

        addStep === "phone" && React.createElement("form", { onSubmit: handleConnectPhone, className: "space-y-3" },
          React.createElement("p", { className: "text-xs text-slate-500" }, "Enter the international phone number to connect to 24/7 cloud mining:"),
          React.createElement("input", {
            type: "tel",
            value: phoneInput,
            onChange: (e) => setPhoneInput(e.target.value),
            placeholder: "+8801700000000",
            className: "w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-900 outline-none"
          }),
          React.createElement("button", {
            type: "submit",
            disabled: modalLoading || !phoneInput.trim(),
            className: "w-full py-2.5 bg-blue-600 text-white font-bold rounded-xl text-xs disabled:opacity-50"
          }, modalLoading ? "Requesting..." : "Send Verification Code")
        ),

        addStep === "code" && React.createElement("form", { onSubmit: handleVerifyCode, className: "space-y-3" },
          React.createElement("p", { className: "text-xs text-slate-500" }, "Enter the 5-digit verification code sent to your Telegram app:"),
          React.createElement("input", {
