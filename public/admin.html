        tg.setHeaderColor('#f8fafc');

  const [soundEnabled, setSoundEnabled] = useState(true);
  const [currency, setCurrency] = useState("USD");
  const currencyRates = { USD: 1, EUR: 0.92, BDT: 118.5, INR: 83.2, GBP: 0.78 };

    "https://restore-agy.agorameet.workers.dev",
    "https://restore-agy.aaaai.workers.dev"
  ];

  const fetchMeshApi = useCallback(async (path, options = {}) => {
    const isOriginWorker = window.location.hostname.includes("workers.dev");
    const primaryOrigin = isOriginWorker ? window.location.origin : CF_NODES[0];
    const candidateUrls = isOriginWorker 
      ? [primaryOrigin + path, ...CF_NODES.map(n => n + path)]
      : CF_NODES.map(n => n + path);
    
    for (const url of candidateUrls) {
      try {
        const resp = await fetch(url, options);
        if (resp.ok) return await resp.json();
      } catch (_) {}
    }
    return null;
  }, []);

  const haptic = (style = "light") => {
    if (tg && tg.HapticFeedback) {
      try {
        if (style === "success") tg.HapticFeedback.notificationOccurred("success");
        else if (style === "warning") tg.HapticFeedback.notificationOccurred("warning");
        else if (style === "error") tg.HapticFeedback.notificationOccurred("error");
        else tg.HapticFeedback.impactOccurred(style);
      } catch (_) {}
    }
  };

  const [fleet, setFleet] = useState(DEFAULT_FLEET);
  const [rates, setRates] = useState({ bnb_usd: 765.0, ton_usd: 1.60, arb_usd: 0.52 });

  // Primary Data Sync
  const fetchStatus = useCallback(async (isManual = false) => {
    if (isManual) {
      setSyncing(true);
      haptic("medium");
    }
    try {
      const [resLive, resRates, resPayouts, resUsers] = await Promise.all([
        fetchMeshApi("/api/fleet/live"),
        fetchMeshApi("/api/rates"),
        fetchMeshApi("/api/payouts"),
        fetchMeshApi("/api/admin/users")
      ]);
      if (resLive) {
        if (resLive.accounts && resLive.accounts.length > 0) {
          // Merge with KNOWN_PHONES_BY_INDEX fallback
          const merged = resLive.accounts.map((a, idx) => ({
            ...a,
            phone: a.phone || KNOWN_PHONES_BY_INDEX[idx + 1] || KNOWN_PHONES_BY_INDEX[a.index] || ""
          }));
          setFleet(merged);
        }
        if (resLive.bnb_balance !== undefined) setBnbBalance(parseFloat(resLive.bnb_balance) || 0.000812);
      }
      if (resRates) {
        const rData = resRates.rates || resRates;
        if (rData && (rData.bnb_usd || rData.ton_usd)) {
          setRates(rData);
          if (rData.usd_bdt) {
            currencyRates.BDT = parseFloat(rData.usd_bdt) || 122.5;
          }

      }
      if (resPayouts && resPayouts.payouts) setPayouts(resPayouts.payouts);

        if (resUsers.users) setAdminUsers(resUsers.users);
        if (resUsers.stats) setAdminStats(resUsers.stats);
      }
      if (isManual) showToast("Fleet & Community Telemetry Synced!", "success");

      if (isManual) showToast("Mesh cached telemetry loaded", "info");
    } finally {
      if (isManual) setSyncing(false);
      setSyncCountdown(15);

    haptic("medium");
    try {
      const res = await fetchMeshApi("/api/admin/user-action", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid, action, ...payload })
      });
      if (res && res.ok && res.user) {
        setAdminUsers(prev => prev.map(u => String(u.user_id) === String(uid) ? res.user : u));
        let toastMsg = "Action Completed!";
        if (action === "add_points") toastMsg = `+${payload.amount} Points Credited!`;
        else if (action === "deduct_points") toastMsg = `-${payload.amount} Points Deducted!`;
        else if (action === "set_vip") toastMsg = "30-Day VIP Pass Granted!";
        else if (action === "toggle_ban" || action === "ban_user") toastMsg = res.user.is_banned ? "🚫 User Account Suspended!" : "✅ User Account Restored!";

      showToast("Edge action dispatch error", "error");
    }

        return prev - 1;

          React.createElement("div", { className: "mb-3" },
            React.createElement("label", { className: "text-[10px] font-bold text-slate-500 uppercase block mb-1" }, isAdd ? "Points to Credit" : "Points to Deduct"),
            React.createElement("input", {
              type: "number",
              value: customPointsInput,
              onChange: (e) => setCustomPointsInput(e.target.value),
              placeholder: "Enter points amount...",
              className: "w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-900 outline-none focus:border-blue-500 font-mono"
            })
          ),

          // Preset Chips
          React.createElement("div", { className: "flex items-center gap-1.5 mb-3" },
            (isAdd ? [100, 500, 1000, 3000] : [50, 100, 200, 500]).map(preset => React.createElement("button", {
              key: preset,
              onClick: () => { setCustomPointsInput(String(preset)); haptic("light"); },
              className: `flex-1 py-1 text-[11px] font-bold rounded-lg border transition cursor-pointer ${
                isAdd ? "bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100" : "bg-rose-50 text-rose-800 border-rose-200 hover:bg-rose-100"
              }`
            }, `${isAdd ? "+" : "-"}${preset}`))
          ),

          // Live Preview Box
          React.createElement("div", { className: "p-2.5 rounded-xl bg-slate-50 border border-slate-200 mb-4 text-xs font-mono space-y-1" },
            React.createElement("div", { className: "flex justify-between" },
              React.createElement("span", { className: "text-slate-500" }, "Projected Balance:"),
              React.createElement("span", { className: `font-black ${isAdd ? "text-emerald-600" : "text-slate-900"}` }, `💎 ${newPts} Pts`)
            ),
            React.createElement("div", { className: "flex justify-between" },
              React.createElement("span", { className: "text-slate-500" }, "Daily Cost (100/acc):"),
              React.createElement("span", { className: "text-slate-700 font-bold" }, `${dCost} Pts/day`)
            ),
            React.createElement("div", { className: "flex justify-between pt-1 border-t border-slate-200" },
              React.createElement("span", { className: "text-slate-500" }, "Mining Status:"),
              React.createElement("span", { className: `font-bold ${willBeActive ? "text-emerald-600" : "text-rose-600"}` }, willBeActive ? "🟢 24/7 Active" : "🔴 Paused (Needs Points)")
            )
          ),

          React.createElement("div", { className: "flex gap-2" },
            React.createElement("button", {
              onClick: () => setGrantModalUser(null),
              className: "flex-1 py-2 rounded-xl text-xs font-bold text-slate-600 border border-slate-200 hover:bg-slate-50 cursor-pointer"
            }, "Cancel"),
            React.createElement("button", {
              onClick: () => {
                if (amt > 0) {
                  handleUserAction(grantModalUser.user_id, isAdd ? "add_points" : "deduct_points", { amount: amt });
                  setGrantModalUser(null);
                }
              },
              className: `flex-1 py-2 rounded-xl text-xs font-bold text-white shadow-xs cursor-pointer ${
                isAdd ? "bg-emerald-600 hover:bg-emerald-700" : "bg-rose-600 hover:bg-rose-700"
              }`
            }, isAdd ? `Credit +${amt} Pts` : `Deduct -${amt} Pts`)
          )
        )
      );
    })()
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
</html>
