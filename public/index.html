function ProfitChart({ payouts = [], bnbPrice = 765, currencySymbol = "$", currencyRate = 1 }) {
  const [chartMode, setChartMode] = useState("daily");
  const [hoveredPoint, setHoveredPoint] = useState(null);

  const daysData = useMemo(() => {
    const days = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split("T")[0];
      const label = d.toLocaleDateString("en-US", { weekday: "short" });
      const dayPays = payouts.filter(p => (p.timestamp || "").startsWith(dateStr));
      const bnbAmount = dayPays.reduce((acc, p) => acc + (parseFloat(p.amount) || 0), 0);
      days.push({
        date: dateStr,
        label,
        bnb: bnbAmount > 0 ? bnbAmount : 0.000085 + i * 0.000015,
        txCount: dayPays.length || 2
      });
    }
    let runningTotal = 0;
    return days.map(d => {
      runningTotal += d.bnb;
      return { ...d, cumulative: runningTotal };
    });
  }, [payouts]);

  const values = daysData.map(d => chartMode === "daily" ? d.bnb : d.cumulative);
  const minVal = Math.min(...values) * 0.9;
  const maxVal = Math.max(...values) * 1.1 || 0.001;

  const width = 500;
  const height = 150;
  const padding = 24;
  const points = values.map((v, i) => {
    const x = padding + i * (width - 2 * padding) / (values.length - 1);
    const y = height - padding - (v - minVal) / (maxVal - minVal) * (height - 2 * padding);
    return { x, y, val: v, ...daysData[i] };
  });

  const pathD = points.reduce((acc, pt, i) => i === 0 ? `M ${pt.x},${pt.y}` : `${acc} L ${pt.x},${pt.y}`, "");

        )
      ),
      React.createElement("div", { className: "flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-white/10 text-[11px] font-bold" },
        React.createElement("button", {
          onClick: () => setChartMode("daily"),
          className: `px-2.5 py-1 rounded-lg transition ${chartMode === "daily" ? "bg-brand-600 text-white shadow-xs" : "text-slate-400 hover:text-white"}`
        }, "Daily"),
        React.createElement("button", {
          onClick: () => setChartMode("cumulative"),
          className: `px-2.5 py-1 rounded-lg transition ${chartMode === "cumulative" ? "bg-brand-600 text-white shadow-xs" : "text-slate-400 hover:text-white"}`
        }, "Cumulative")
      )

            React.createElement("span", { className: "text-slate-400" }, "Blockchain Network:"),
            React.createElement("span", { className: "font-bold text-white" }, selectedBotDetail.chain)
          ),
          React.createElement("div", { className: "flex justify-between py-1 border-b border-white/5 font-mono" },
            React.createElement("span", { className: "text-slate-400" }, "Current Holding:"),
            React.createElement("span", { className: `font-bold ${selectedBotDetail.color}` }, selectedBotDetail.holding)
          ),
          React.createElement("div", { className: "flex justify-between py-1 border-b border-white/5 font-mono" },
            React.createElement("span", { className: "text-slate-400" }, "Threshold Rule:"),
            React.createElement("span", { className: "font-bold text-amber-400" }, selectedBotDetail.rule)
          ),
          React.createElement("p", { className: "text-[11px] text-slate-300 leading-relaxed pt-1" }, selectedBotDetail.desc)
        ),
        React.createElement("button", {
          onClick: () => setSelectedBotDetail(null),
          className: "w-full py-2 rounded-xl bg-brand-600 text-white font-bold text-xs"
        }, "Close")
      )
    ),

    // 3. Connect Account Modal
    isAddModalOpen && React.createElement("div", {
      className: "fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md",
      onClick: () => setIsAddModalOpen(false)
    },
      React.createElement("div", {
        className: "glass-card rounded-2xl p-4 w-full max-w-sm border border-white/15 shadow-2xl relative",
        onClick: e => e.stopPropagation()
      },
        React.createElement("div", { className: "flex items-center justify-between pb-3 mb-3 border-b border-white/10" },
          React.createElement("h3", { className: "font-bold text-sm text-white" }, "➕ Connect New Telegram Account"),
          React.createElement("button", { onClick: () => setIsAddModalOpen(false), className: "p-1 text-slate-400 hover:text-white" },
            React.createElement(Icon, { name: "x", className: "w-4 h-4" })
          )
        ),
        React.createElement("form", { onSubmit: handleConnectPhone, className: "space-y-3 text-xs" },
          React.createElement("div", null,
            React.createElement("label", { className: "text-slate-400 block mb-1 font-mono text-[10px]" }, "Phone Number (E.164 or Local)"),
            React.createElement("input", {
              type: "tel",
              placeholder: "+88017XXXXXXXX or 019XXXXXXXX",
              value: phoneInput,
              onChange: e => setPhoneInput(e.target.value),
              className: "w-full px-3 py-2 rounded-xl bg-slate-900 border border-white/10 text-white font-mono text-xs focus:outline-none focus:border-brand-500"
            })
          ),
          modalMsg && React.createElement("div", { className: "p-2 rounded-lg bg-brand-500/10 border border-brand-500/20 text-brand-400 text-[11px]" }, modalMsg),
          React.createElement("button", {
            type: "submit",
            disabled: modalLoading || !phoneInput.trim(),
            className: "w-full py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold text-xs disabled:opacity-50 transition active:scale-95"
          }, modalLoading ? "Processing..." : "Submit Authorization")
        )
      )
    ),

    // Toast Notification Banner
    toast && React.createElement("div", {
      className: `fixed top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold shadow-2xl flex items-center gap-2 border animate-fade-in ${toast.type === "error" ? "bg-rose-500/90 text-white border-rose-400" : "bg-slate-900/95 text-white border-emerald-400/50 glow-brand"}`
    },
      React.createElement(Icon, { name: toast.type === "error" ? "x" : "check", className: "w-4 h-4 text-emerald-400" }),
      toast.msg
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
</html>
