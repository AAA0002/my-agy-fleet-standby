    React.createElement("nav", { className: "fixed bottom-0 left-0 right-0 z-40 pro-dock py-2 px-3 flex items-center justify-around max-w-md mx-auto" },
      [
        { id: "users", label: "Miners Hub", icon: "users", badge: adminUsers.length },
        { id: "fleet", label: "Fleet Pools", icon: "bot", badge: fleet.length },
        { id: "ledger", label: "Ledger", icon: "receipt" },
        { id: "ai", label: "Ari AI", icon: "sparkles", highlight: true }
      ].map(tab => {
        const isActive = activeTab === tab.id;
        return React.createElement("button", {
          key: tab.id,
          onClick: () => { setActiveTab(tab.id); haptic("light"); if (soundEnabled) playSound("click"); },
          className: `flex flex-col items-center justify-center py-1 px-3 rounded-xl transition cursor-pointer ${
            isActive ? "text-blue-600 font-bold" : "text-slate-500 hover:text-slate-800"
          }`
        },
          React.createElement("div", { className: "relative" },
            React.createElement(Icon, { name: tab.icon, className: `w-5 h-5 ${isActive ? "stroke-[2.5]" : "stroke-[1.75]"}` }),
            tab.badge !== undefined && tab.badge > 0 && React.createElement("span", { className: "absolute -top-1 -right-2 text-[9px] bg-blue-50 text-blue-700 font-mono font-bold px-1 rounded-full border border-blue-200" }, tab.badge),
            tab.highlight && !isActive && React.createElement("span", { className: "absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-blue-500" })
          ),
          React.createElement("span", { className: "text-[10px] mt-0.5" }, tab.label)
        );
      })
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
  </script>
