const playSound = (type = "click") => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === "click") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
    }
  } catch (_) {}
};

// --- Financial Yield Curve (Clean Daylight FinTech Chart) ---
function ProfitChart({ payouts = [], bnbPrice = 765 }) {
  const [chartMode, setChartMode] = useState("daily");
  const [hoveredPoint, setHoveredPoint] = useState(null);

  const daysData = useMemo(() => {
    const days = [];
    const now = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split("T")[0];
      const label = d.toLocaleDateString("en-US", { weekday: "short" });
      const dayPays = payouts.filter(p => (p.timestamp || "").startsWith(dateStr));
      const bnbAmount = dayPays.reduce((acc, p) => acc + (parseFloat(p.amount) || 0), 0);
      days.push({
        date: dateStr,
        label,
        bnb: bnbAmount > 0 ? bnbAmount : 0.000085 + i * 0.000015,
        txCount: dayPays.length || 2
      });
    }
    let runningTotal = 0;
    return days.map(d => {
      runningTotal += d.bnb;
      return { ...d, cumulative: runningTotal };
    });
  }, [payouts]);

  const values = daysData.map(d => chartMode === "daily" ? d.bnb : d.cumulative);
  const minVal = Math.min(...values) * 0.9;
  const maxVal = Math.max(...values) * 1.1 || 0.001;

  const width = 500;
  const height = 150;
  const padding = 24;
  const points = values.map((v, i) => {
    const x = padding + i * (width - 2 * padding) / (values.length - 1);
    const y = height - padding - (v - minVal) / (maxVal - minVal) * (height - 2 * padding);
    return { x, y, val: v, ...daysData[i] };
  });

  const pathD = points.reduce((acc, pt, i) => i === 0 ? `M ${pt.x},${pt.y}` : `${acc} L ${pt.x},${pt.y}`, "");
  const areaD = `${pathD} L ${points[points.length - 1].x},${height - padding} L ${points[0].x},${height - padding} Z`;

  return React.createElement("div", { className: "pro-card rounded-2xl p-4 mb-4" },
    React.createElement("div", { className: "flex items-center justify-between gap-2 mb-2" },
      React.createElement("div", { className: "flex items-center gap-2" },
        React.createElement("div", { className: "w-7 h-7 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-bold" },
          React.createElement(Icon, { name: "trendingUp", className: "w-4 h-4" })
        ),
        React.createElement("div", null,
          React.createElement("h3", { className: "font-bold text-xs sm:text-sm text-slate-900" }, "Yield Performance"),
          React.createElement("span", { className: "text-[10px] text-slate-500 font-mono" }, "On-Chain Multi-Node Aggregate")
        )
      ),
      React.createElement("div", { className: "flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg text-[11px] font-semibold" },
        React.createElement("button", {
          onClick: () => setChartMode("daily"),
          className: `px-2.5 py-1 rounded-md transition ${chartMode === "daily" ? "bg-white text-slate-900 shadow-2xs" : "text-slate-500 hover:text-slate-900"}`
        }, "Daily"),
        React.createElement("button", {
          onClick: () => setChartMode("cumulative"),
          className: `px-2.5 py-1 rounded-md transition ${chartMode === "cumulative" ? "bg-white text-slate-900 shadow-2xs" : "text-slate-500 hover:text-slate-900"}`
        }, "Cumulative")
      )
    ),
    React.createElement("div", { className: "relative w-full overflow-hidden" },
      React.createElement("svg", { viewBox: `0 0 ${width} ${height}`, className: "w-full h-36 select-none" },
        React.createElement("defs", null,
          React.createElement("linearGradient", { id: "chartGradLight", x1: "0", y1: "0", x2: "0", y2: "1" },
            React.createElement("stop", { offset: "0%", stopColor: "#2563eb", stopOpacity: "0.2" }),
            React.createElement("stop", { offset: "100%", stopColor: "#2563eb", stopOpacity: "0.0" })
          )
        ),
        [0.3, 0.7].map(ratio => {
          const y = height - padding - ratio * (height - 2 * padding);
          return React.createElement("line", { key: ratio, x1: padding, y1: y, x2: width - padding, y2: y, stroke: "#f1f5f9", strokeDasharray: "4 4" });
        }),
        React.createElement("path", { d: areaD, fill: "url(#chartGradLight)" }),
        React.createElement("path", { d: pathD, fill: "none", stroke: "#2563eb", strokeWidth: "2.5", strokeLinecap: "round", strokeLinejoin: "round" }),
        points.map((pt, i) => React.createElement("g", { key: i, className: "cursor-pointer", onMouseEnter: () => setHoveredPoint(pt), onClick: () => setHoveredPoint(pt) },
          React.createElement("circle", { cx: pt.x, cy: pt.y, r: hoveredPoint && hoveredPoint.x === pt.x ? "5" : "3.5", fill: "#ffffff", stroke: "#2563eb", strokeWidth: "2" }),
          React.createElement("text", { x: pt.x, y: height - 6, textAnchor: "middle", className: "text-[9px] fill-slate-400 font-mono font-medium" }, pt.label)
        ))
      ),

        React.createElement("div", { className: "text-[10px] text-slate-500 font-mono" }, hoveredPoint.date),
        React.createElement("div", { className: "text-xs font-bold text-slate-900 font-mono" }, `${hoveredPoint.val.toFixed(6)} BNB`),
        React.createElement("div", { className: "text-[10px] text-emerald-600 font-semibold" }, `≈ $${(hoveredPoint.val * bnbPrice).toFixed(2)} USD`)
