const playSound = (type = "click") => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === "click") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.05, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
    }
  } catch (_) {}
};


function AdminAuthGate({ onSuccess, fetchMeshApi, haptic, showToast, soundEnabled }) {
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [biometricSupported, setBiometricSupported] = useState(false);
  const [biometricLoading, setBiometricLoading] = useState(false);

  useEffect(() => {
    if (typeof window !== "undefined" && window.PublicKeyCredential) {
      if (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
          .then(avail => setBiometricSupported(Boolean(avail)))
          .catch(() => setBiometricSupported(true));
      } else {
        setBiometricSupported(true);
      }
    }
  }, []);

  const handlePasswordLogin = async (e) => {
    if (e) e.preventDefault();
    if (!password.trim()) {
      setErrorMsg("Please enter the master admin password.");
      haptic("warning");
      return;
    }
    setLoading(true);
    setErrorMsg("");
    haptic("medium");

    try {
      const res = await fetchMeshApi("/api/admin/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password.trim() })
      });

      if (res && res.ok && res.token) {
        haptic("success");
        onSuccess(res.token, res);
      } else {
        haptic("error");
        setErrorMsg(res?.error || "Incorrect password. Access denied.");
      }
    } catch (err) {
      haptic("error");
      setErrorMsg("Connection error: " + err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleBiometricLogin = async () => {
    setErrorMsg("");
    setBiometricLoading(true);
    haptic("medium");

    try {
      if (!window.PublicKeyCredential) {
        setErrorMsg("Biometrics/Passkeys not supported in this browser.");
        setBiometricLoading(false);
        return;
      }

      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge,
          rpId: window.location.hostname,
          userVerification: "preferred",
          timeout: 60000
        }
      });

      if (assertion && assertion.id) {
        const res = await fetchMeshApi("/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            passkey_credential_id: assertion.id,
            credential_id: assertion.id
          })
        });

        if (res && res.ok && res.token) {
          haptic("success");
          onSuccess(res.token, res);
          return;
        } else {
          setErrorMsg(res?.error || "Fingerprint passkey not found. Login with password first to enroll.");
        }
      }
    } catch (err) {
      if (err.name !== "NotAllowedError" && err.name !== "AbortError") {
        setErrorMsg("Biometric note: " + err.message);
      }
    } finally {
      setBiometricLoading(false);
    }
  };

  const handleEnrollBiometrics = async () => {
    if (!password.trim()) {
      setErrorMsg("Enter master password to authorize enrolling device fingerprint.");
      haptic("warning");
      return;
    }
    setBiometricLoading(true);
    setErrorMsg("");
    haptic("medium");

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);
      const userIdBytes = new TextEncoder().encode("arif_6727787768");

      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: "AAA AUTO Executive Console", id: window.location.hostname },
          user: { id: userIdBytes, name: "arif", displayName: "Commander Arif" },
          pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
          authenticatorSelection: {
            authenticatorAttachment: "platform",
            userVerification: "preferred"
          },
          timeout: 60000,
          attestation: "none"
        }
      });

      if (cred && cred.id) {
        const res = await fetchMeshApi("/api/admin/auth/register-passkey", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: password.trim(),
            credential_id: cred.id,
            transports: ["internal"]
          })
        });

        if (res && res.ok) {
          haptic("success");
          showToast("Fingerprint Registered in Supabase!", "success");
          handlePasswordLogin();
        } else {
          setErrorMsg(res?.error || "Failed to register fingerprint passkey.");
        }
      }
    } catch (err) {
      setErrorMsg("Enrollment note: " + err.message);
    } finally {
      setBiometricLoading(false);
    }
  };

  return React.createElement("div", { className: "min-h-screen flex items-center justify-center p-4 bg-slate-50 font-sans" },
    React.createElement("div", { className: "w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl border border-slate-200 animate-slide-up text-center" },
      React.createElement("div", { className: "w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center text-3xl shadow-md border-2 border-white" }, "🛡️"),
      React.createElement("h2", { className: "text-lg font-black text-slate-900 tracking-tight mb-1" }, "ADMIN SECURITY GATE"),
      React.createElement("p", { className: "text-xs text-slate-500 mb-5 leading-relaxed" }, "Commander Arif Executive Access · Protected by Supabase Cloud Postgres & WebAuthn Biometrics"),

      errorMsg && React.createElement("div", { className: "mb-4 p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center justify-center gap-1.5 animate-pulse" },
        "⚠️ ", errorMsg
      ),

      React.createElement("button", {
        type: "button",
        onClick: handleBiometricLogin,
        disabled: biometricLoading,
        className: "w-full py-3 px-4 mb-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-extrabold shadow-md flex items-center justify-center gap-2 cursor-pointer transition active:scale-98 disabled:opacity-50"
      },
        React.createElement("span", { className: "text-base" }, "👆"),
        biometricLoading ? "Verifying Sensor..." : "One-Tap Fingerprint / Passkey Login"
      ),
      React.createElement("div", { className: "text-[10px] text-slate-400 mb-4 font-mono" }, "Supports Samsung, Android Fingerprint & Face ID"),

      React.createElement("div", { className: "relative my-4" },
        React.createElement("div", { className: "absolute inset-0 flex items-center" },
          React.createElement("div", { className: "w-full border-t border-slate-200" })
        ),
        React.createElement("div", { className: "relative flex justify-center text-[10px] uppercase font-bold text-slate-400 bg-white px-2 tracking-wider" }, "Or Master Password")

        },

function App() {
  const tg = window.Telegram?.WebApp;
  const webAppUserId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
  const isDenied = Boolean(webAppUserId && webAppUserId !== "6727787768");
  const [authToken, setAuthToken] = useState(() => {
    try {
      return sessionStorage.getItem("atf_admin_token") || localStorage.getItem("atf_admin_token") || "";
    } catch (_) { return ""; }
  });
  const [isAuthenticated, setIsAuthenticated] = useState(() => Boolean(authToken));

  useEffect(() => {
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor('#f8fafc');
        tg.setBackgroundColor('#f8fafc');
      } catch (_) {}
    }
  }, []);

  const [soundEnabled, setSoundEnabled] = useState(true);

  const CF_NODES = [
    "https://restore-agy.aaaai2.workers.dev",
    "https://restore-agy.aaa-bot.workers.dev",
    "https://restore-agy.aaa222.workers.dev",
    "https://restore-agy.agorameet.workers.dev",
    "https://restore-agy.aaaai.workers.dev"
  ];

  const fetchMeshApi = useCallback(async (path, options = {}) => {
    const isOriginWorker = window.location.hostname.includes("workers.dev");
    const primaryOrigin = isOriginWorker ? window.location.origin : CF_NODES[0];
    const candidateUrls = isOriginWorker 
      ? [primaryOrigin + path, ...CF_NODES.map(n => n + path)]
      : CF_NODES.map(n => n + path);
    
    const activeToken = authToken || (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("atf_admin_token") : "") || (typeof localStorage !== "undefined" ? localStorage.getItem("atf_admin_token") : "") || "";
    for (const url of candidateUrls) {
      try {
        const headers = {
          ...(options.headers || {}),
          "X-Telegram-Init-Data": tg?.initData || "",
          "Authorization": activeToken ? `Bearer ${activeToken}` : (tg?.initData ? `tma ${tg.initData}` : ""),
          "X-Admin-Token": activeToken || ""
        };
        const resp = await fetch(url, { ...options, headers });
        if (resp.ok) return await resp.json();
      } catch (_) {}
    }
    return null;
  }, [authToken]);

  useEffect(() => {
    const savedToken = (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("atf_admin_token") : "") || (typeof localStorage !== "undefined" ? localStorage.getItem("atf_admin_token") : "");
    if (savedToken) {
      fetchMeshApi("/api/admin/auth/check").then(res => {
        if (!res || !res.authenticated) {
          setAuthToken("");
          setIsAuthenticated(false);
          try {
            sessionStorage.removeItem("atf_admin_token");
            localStorage.removeItem("atf_admin_token");
          } catch (_) {}
        }
      }).catch(() => {});
    }
  }, [fetchMeshApi]);

  const haptic = (style = "light") => {
    if (tg && tg.HapticFeedback) {
      try {
        if (style === "success") tg.HapticFeedback.notificationOccurred("success");
        else if (style === "warning") tg.HapticFeedback.notificationOccurred("warning");
        else if (style === "error") tg.HapticFeedback.notificationOccurred("error");
        else tg.HapticFeedback.impactOccurred(style);
      } catch (_) {}
    }
  };

  const [actionLoadingId, setActionLoadingId] = useState(null);
  const [selectedUserDetail, setSelectedUserDetail] = useState(null);
  const [initialLoading, setInitialLoading] = useState(true);

  // Quick Point Grant & Deduct Modal
  const [grantModalUser, setGrantModalUser] = useState(null);
  const [customPointsInput, setCustomPointsInput] = useState("100");
