    isMeshModalOpen && React.createElement("div", {

      React.createElement("div", {
        className: "bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl border border-slate-200",
        onClick: (e) => e.stopPropagation()

        React.createElement("div", { className: "flex items-center justify-between pb-3 mb-3 border-b border-slate-100" },

          React.createElement("button", {
            onClick: () => setIsMeshModalOpen(false),

          Object.keys(meshPings).length === 0 ? React.createElement("div", { className: "text-center text-xs text-slate-400 py-4" }, "Testing nodes...") :

              React.createElement("span", { className: "w-2 h-2 rounded-full bg-emerald-500" }),

        React.createElement("button", {
          onClick: testMeshNodes,
          disabled: testingMesh,
          className: "w-full py-2 bg-blue-600 text-white font-bold rounded-xl text-xs disabled:opacity-50 cursor-pointer"
        }, testingMesh ? "Pinging..." : "Re-Test Mesh Latencies")
      )

    // ==========================================================

    // ==========================================================
    selectedAccount && (() => {
      const accNum = selectedAccount.index || (fleet.indexOf(selectedAccount) + 1);
      const phone = selectedAccount.phone || KNOWN_PHONES_BY_INDEX[accNum] || "Cloud Connected";
      const isHost = String(selectedAccount.user_id) === "6727787768";

      return React.createElement("div", {

        onClick: () => setSelectedAccount(null)

          className: "bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl border border-slate-200 animate-slide-up",

          React.createElement("div", { className: "flex items-center justify-between pb-3 mb-3 border-b border-slate-100" },

              React.createElement("span", { className: "w-7 h-7 rounded-xl bg-blue-50 text-blue-700 font-mono text-xs font-black flex items-center justify-center border border-blue-200" },
                `#${accNum}`

              React.createElement("div", null,
                React.createElement("h3", { className: "font-black text-sm text-slate-900 leading-tight" }, selectedAccount.name || `Account #${accNum}`),
                React.createElement("span", { className: "text-[10px] text-slate-400 font-mono" }, isHost ? "Master Fleet Host 👑" : "Worker Node 🟢")

              onClick: () => setSelectedAccount(null),
              className: "w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center cursor-pointer"
            }, React.createElement(Icon, { name: "x", className: "w-4 h-4" }))

            React.createElement("div", { className: "p-2.5 bg-slate-50 rounded-xl border border-slate-100 space-y-1.5 font-mono" },
              React.createElement("div", { className: "flex items-center justify-between" },
                React.createElement("span", { className: "text-slate-400 text-[11px]" }, "Phone:"),
                React.createElement("div", { className: "flex items-center gap-1 font-bold text-slate-800" },
                  React.createElement("span", null, phone),
                  React.createElement("button", {
                    onClick: () => copyToClipboard(phone, `Copied: ${phone}`),
                    className: "p-1 hover:bg-slate-200 rounded text-slate-400 hover:text-slate-600 cursor-pointer"
                  }, React.createElement(Icon, { name: "copy", className: "w-3 h-3" }))
                )
              ),
              React.createElement("div", { className: "flex items-center justify-between" },
                React.createElement("span", { className: "text-slate-400 text-[11px]" }, "Telegram ID:"),
                React.createElement("div", { className: "flex items-center gap-1 font-bold text-slate-800" },
                  React.createElement("span", null, selectedAccount.user_id || "Cloud ID"),
                  selectedAccount.user_id && React.createElement("button", {
                    onClick: () => copyToClipboard(String(selectedAccount.user_id), `Copied ID: ${selectedAccount.user_id}`),
                    className: "p-1 hover:bg-slate-200 rounded text-slate-400 hover:text-slate-600 cursor-pointer"
                  }, React.createElement(Icon, { name: "copy", className: "w-3 h-3" }))
                )
              ),
              React.createElement("div", { className: "flex items-center justify-between" },
                React.createElement("span", { className: "text-slate-400 text-[11px]" }, "MTProto Cloud:"),
                React.createElement("span", { className: "font-bold text-emerald-600 flex items-center gap-1" },
                  React.createElement("span", { className: "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" }),
                  "Active & Mining"
                )
              ),
              React.createElement("div", { className: "flex items-center justify-between" },
                React.createElement("span", { className: "text-slate-400 text-[11px]" }, "Vault BSC:"),
                React.createElement("span", { className: "font-mono text-[10px] text-slate-600" }, "0xfda4...d5ce")
              )
            ),
            React.createElement("div", null,
              React.createElement("span", { className: "text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5" }, "7 Mining Pools Active"),
              React.createElement("div", { className: "grid grid-cols-2 gap-1.5 text-[10px] font-mono" },
                [
                  { name: "ATF Miner", status: "Auto-Claim" },
                  { name: "Stones Miner", status: "Arbitrum One" },
                  { name: "MRG Miner", status: "Peak Tier" },
                  { name: "AI Lab Robot", status: "BEP-20 Active" },
                  { name: "UltraWallet", status: "Auto-Mining" },
                  { name: "FINVORA Web3", status: "Daily Auto-Claim" },
                  { name: "Victor's Company", status: "Mining Active" }
                ].map((p, pIdx) => React.createElement("div", {
                  key: pIdx,
                  className: "p-1.5 bg-slate-50 border border-slate-100 rounded-lg flex items-center justify-between"
                },
                  React.createElement("span", { className: "font-bold text-slate-700 truncate" }, p.name),
                  React.createElement("span", { className: "text-[9px] text-emerald-600 font-bold" }, p.status)
                ))
              )
            )
          ),
          React.createElement("button", {
            onClick: () => setSelectedAccount(null),
            className: "w-full py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition cursor-pointer"
          }, "Close")
        )
      );
    })()
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
  </script>
</body>
