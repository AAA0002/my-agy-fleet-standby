function AdminAuthGate({ onSuccess, fetchMeshApi, haptic, showToast, soundEnabled, isDark }) {
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [biometricSupported, setBiometricSupported] = useState(false);
  const [biometricLoading, setBiometricLoading] = useState(false);

  useEffect(() => {
    if (typeof window !== "undefined" && window.PublicKeyCredential) {
      if (PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
        PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
          .then(avail => setBiometricSupported(Boolean(avail)))
          .catch(() => setBiometricSupported(true));
      } else {
        setBiometricSupported(true);
      }
    }
  }, []);

  const handlePasswordLogin = async (e) => {
    if (e) e.preventDefault();
    if (!password.trim()) {
      setErrorMsg("Please enter the master admin password.");
      haptic("warning");
      return;
    }
    setLoading(true);
    setErrorMsg("");
    haptic("medium");

    try {
      const res = await fetchMeshApi("/api/admin/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password.trim() })
      });

      if (res && res.ok && res.token) {
        haptic("success");
        onSuccess(res.token, res);
      } else {
        haptic("error");
        setErrorMsg(res?.error || "Incorrect password. Access denied.");
      }
    } catch (err) {
      haptic("error");
      setErrorMsg("Connection error: " + err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleBiometricLogin = async () => {
    setErrorMsg("");
    setBiometricLoading(true);
    haptic("medium");

    try {
      if (!window.PublicKeyCredential) {
        setErrorMsg("Biometrics/Passkeys not supported in this browser.");
        setBiometricLoading(false);
        return;
      }

      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge,
          rpId: window.location.hostname,
          userVerification: "preferred",
          timeout: 60000
        }
      });

      if (assertion && assertion.id) {
        const res = await fetchMeshApi("/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            passkey_credential_id: assertion.id,
            credential_id: assertion.id
          })
        });

        if (res && res.ok && res.token) {
          haptic("success");
          onSuccess(res.token, res);
          return;
        } else {
          setErrorMsg(res?.error || "Fingerprint passkey not found. Login with password first to enroll.");
        }
      }
    } catch (err) {
      if (err.name !== "NotAllowedError" && err.name !== "AbortError") {
        setErrorMsg("Biometric note: " + err.message);
      }
    } finally {
      setBiometricLoading(false);
    }
  };

    React.createElement("div", { className: `w-full max-w-sm rounded-3xl p-6 shadow-2xl border animate-slide-up text-center ${isDark ? 'bg-dark-900 border-dark-700' : 'bg-white border-slate-200'}` },
      React.createElement("div", { className: "w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 text-white flex items-center justify-center text-3xl shadow-glow-blue border-2 border-white/20" }, "🛡️"),
      React.createElement("h2", { className: `text-lg font-black tracking-tight mb-1 ${isDark ? 'text-white' : 'text-slate-900'}` }, "EXECUTIVE SECURITY GATE"),
      React.createElement("p", { className: "text-xs text-slate-400 mb-5 leading-relaxed" }, "Commander Arif · Protected by Cloud Edge & WebAuthn Biometrics"),

      errorMsg && React.createElement("div", { className: "mb-4 p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold flex items-center justify-center gap-1.5 animate-pulse" },
        "⚠️ ", errorMsg
      ),

      React.createElement("button", {
        type: "button",
        onClick: handleBiometricLogin,
        disabled: biometricLoading,
        className: "w-full py-3 px-4 mb-3 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white text-xs font-extrabold shadow-glow-emerald flex items-center justify-center gap-2 cursor-pointer transition active:scale-98 disabled:opacity-50"
      },
        React.createElement("span", { className: "text-base" }, "👆"),
        biometricLoading ? "Verifying Sensor..." : "One-Tap Fingerprint / Passkey Login"
      ),
      React.createElement("div", { className: "text-[10px] text-slate-500 mb-4 font-mono" }, "Supports Samsung, Android Fingerprint & Face ID"),

      React.createElement("div", { className: "relative my-4" },

                )

              React.createElement("div", { className: "flex items-center justify-between" },
                React.createElement("span", { className: "text-slate-400" }, "Telegram ID:"),

          React.createElement("button", {

          React.createElement("div", null,

              value: codeInput,
              onChange: (e) => setCodeInput(e.target.value),
              placeholder: "12345",
              className: `w-full px-3 py-2.5 border rounded-xl text-center text-lg font-mono font-black tracking-widest outline-none ${isDark ? 'bg-dark-850 border-dark-700 text-cyan-400' : 'bg-slate-50 border-slate-200 text-blue-600'}`
            })
          ),
          React.createElement("button", {
            type: "submit",
            disabled: modalLoading || !codeInput.trim(),

          }, modalLoading ? "Verifying..." : "Verify Code")
        ),

        addStep === "2fa" && React.createElement("form", { onSubmit: handleVerify2FA, className: "space-y-3" },
          React.createElement("div", null,
            React.createElement("label", { className: "text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1" }, "Two-Factor Cloud Password"),
            React.createElement("input", {
              type: "password",
              value: twoFaInput,
              onChange: (e) => setTwoFaInput(e.target.value),
              placeholder: "Enter 2FA password...",
              className: `w-full px-3 py-2.5 border rounded-xl text-xs font-mono font-bold outline-none ${isDark ? 'bg-dark-850 border-dark-700 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'}`
            })
          ),
          React.createElement("button", {
            type: "submit",
            disabled: modalLoading || !twoFaInput.trim(),
            className: "w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold rounded-xl text-xs shadow-glow-emerald transition cursor-pointer"
          }, modalLoading ? "Verifying 2FA..." : "Submit 2FA Password")
        ),

        addStep === "success" && React.createElement("div", { className: "py-4 text-center space-y-2" },
          React.createElement("div", { className: "text-3xl" }, "🎉"),
          React.createElement("div", { className: "font-black text-sm text-emerald-400" }, "Account Bound Successfully!"),
          React.createElement("p", { className: "text-xs text-slate-400" }, "Session active in cloud MTProto mesh. Autonomous 24/7 farming initiated.")
        )
      )
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
