// Audio Feedback System
const audioContextRef = { current: null };
function playSound(type) {
  try {
    if (!audioContextRef.current) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) audioContextRef.current = new AudioCtx();
    }
    const ctx = audioContextRef.current;
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    if (type === "click") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if (type === "success") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === "error") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.15);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === "broadcast" || type === "fanfare") {
      const freqs = [523.25, 659.25, 783.99, 1046.50];
      freqs.forEach((freq, idx) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(freq, now + idx * 0.05);
        g.gain.setValueAtTime(0.12, now + idx * 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.12);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(now + idx * 0.05);
        o.stop(now + idx * 0.05 + 0.12);
      });
    }
  } catch (_) {}
}

// ==============================================================
// AUTHENTICATION GATE (PIN 2743 & FINGERPRINT SENSOR)
// ==============================================================
function AdminAuthGate({ onSuccess, fetchMeshApi, haptic, showToast, soundEnabled, isDarkMode }) {
  const [pin, setPin] = useState("");
  const [loading, setLoading] = useState(false);
  const [biometricLoading, setBiometricLoading] = useState(false);
  const [authError, setAuthError] = useState("");
  const [hasPasskeyLocally, setHasPasskeyLocally] = useState(() => {
    try { return Boolean(localStorage.getItem("admin_passkey_cred_id")); } catch (_) { return false; }
  });

  const PIN_LENGTH = 4; // Commander Arif Signature PIN 2743

  const handleDigit = (d) => {
    if (pin.length >= PIN_LENGTH) return;
    const nextPin = pin + d;
    setPin(nextPin);
    haptic("light");
    if (soundEnabled) playSound("click");
    if (nextPin.length === PIN_LENGTH) {
      submitAuth(nextPin);
    }
  };

  const handleBackspace = () => {
    setPin(prev => prev.slice(0, -1));
    haptic("light");
    if (soundEnabled) playSound("click");
  };

  useEffect(() => {
    const handleKeyDown = (e) => {
      if (loading || biometricLoading) return;
      if (e.key >= "0" && e.key <= "9") {
        handleDigit(e.key);
      } else if (e.key === "Backspace") {
        handleBackspace();
      } else if (e.key === "Escape" || e.key === "c" || e.key === "C") {
        setPin("");
      }
    };
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [pin, loading, biometricLoading]);

  const submitAuth = async (pinValue) => {
    setLoading(true);
    setAuthError("");
    haptic("medium");
    try {
      const res = await fetchMeshApi("/api/admin/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pinValue, is_pin: true })
      });
      if (res && (res.authenticated || res.ok || res.token)) {
        haptic("success");
        if (soundEnabled) playSound("success");
        onSuccess(res.token || res.session_token, res);
      } else {
        setAuthError(res?.error || "Invalid PIN (2743). Try again.");
        setPin("");
        haptic("error");
        if (soundEnabled) playSound("error");
      }
    } catch (e) {
      setAuthError("Auth error: " + e.message);
      setPin("");
      haptic("error");
      if (soundEnabled) playSound("error");
    } finally {
      setLoading(false);
    }
  };

  const isWebAuthnSupported = typeof window !== "undefined" && Boolean(window.PublicKeyCredential);
  const tgBio = typeof window !== "undefined" ? window.Telegram?.WebApp?.BiometricManager : null;
  const isTgBioSupported = Boolean(tgBio && (tgBio.isBiometricAvailable || typeof tgBio.init === "function"));
  const hasTelegramEnv = typeof window !== "undefined" && Boolean(window.Telegram?.WebApp?.initData);

  const fallbackBiometricOrGuide = async () => {
    if (!isWebAuthnSupported) {
      setBiometricLoading(false);
      haptic("warning");
      if (hasTelegramEnv) {
        setAuthError("💡 Inside Telegram: Enter PIN 2743 below, or tap top-right (⋮) -> 'Open in Chrome' for Fingerprint Passkeys!");
      } else {
        setAuthError("💡 Passkeys not supported in this browser. Please enter PIN 2743 below!");
      }
      return;
    }

    try {
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge,
          rpId: window.location.hostname,
          userVerification: "preferred",
          timeout: 60000
        }
      });

      if (assertion && assertion.id) {
        const res = await fetchMeshApi("/api/admin/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            passkey_credential_id: assertion.id,
            credential_id: assertion.id
          })
        });

        if (res && (res.authenticated || res.ok || res.token)) {
          haptic("success");
          if (soundEnabled) playSound("success");
          try { localStorage.setItem("admin_passkey_cred_id", assertion.id); } catch (_) {}
          onSuccess(res.token || res.session_token, res);
          return;
        } else {
          setAuthError(res?.error || "Passkey not recognized. Enter PIN 2743 first, then tap '👆 Passkey' in the header to register your fingerprint.");
        }
      }
    } catch (err) {
      if (err.name === "NotAllowedError" || err.name === "AbortError") {
        if (!hasPasskeyLocally) {
          setAuthError("💡 No passkey enrolled on this device yet. Enter PIN 2743 below, then tap '👆 Passkey' in header to register!");
        } else {
          setAuthError("Fingerprint prompt was cancelled. Tap again or enter PIN 2743.");
        }
      } else {
        setAuthError("Biometric info: " + err.message);
      }
    } finally {
      setBiometricLoading(false);
    }
  };

  const handleBiometricLogin = async () => {
    setAuthError("");
    setBiometricLoading(true);
    haptic("medium");

    if (tgBio && typeof tgBio.init === "function") {
      try {
        tgBio.init(() => {
          if (tgBio.isBiometricAvailable) {
            const doTgAuth = () => {
              tgBio.authenticate({ reason: "Unlock Commander Arif Console" }, (success) => {
                setBiometricLoading(false);
                if (success) {
                  haptic("success");
                  if (soundEnabled) playSound("success");
                  submitAuth("2743");
                } else {
                  setAuthError("Fingerprint not recognized. Enter PIN 2743 below.");
                }
              });
            };

            if (!tgBio.isAccessGranted) {
              tgBio.requestAccess({ reason: "Enable Fingerprint Unlock" }, (granted) => {
                if (granted) doTgAuth();
                else {
                  setBiometricLoading(false);
                  setAuthError("Biometric access denied. Please enter PIN 2743 below.");
                }
              });
            } else {
              doTgAuth();
            }
          } else {
            fallbackBiometricOrGuide();
          }
        });
        return;
      } catch (_) {
        fallbackBiometricOrGuide();
        return;
      }
    }

    fallbackBiometricOrGuide();
  };

  return React.createElement("div", {
    className: `min-h-screen flex flex-col items-center justify-center px-4 py-8 max-w-sm mx-auto ${isDarkMode ? "bg-slate-950 text-white" : "bg-slate-50 text-slate-900"}`
  },
    React.createElement("div", { className: "w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 text-white flex items-center justify-center text-3xl mb-3 shadow-lg shadow-blue-500/20 animate-pulse" }, "👑"),
    React.createElement("h1", { className: "text-lg font-black tracking-tight mb-0.5 uppercase" }, "User Bot Operations"),
    React.createElement("p", { className: "text-xs text-slate-400 mb-4 text-center" }, "Commander Arif · PIN 2743 or Fingerprint Sensor"),

    // 1-Tap Biometric Fingerprint / Passkey Button
    React.createElement("button", {
      type: "button",
      onClick: handleBiometricLogin,
      disabled: biometricLoading || loading,
      className: `tap-target w-full py-3.5 px-4 mb-4 rounded-2xl bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white text-xs font-black shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 cursor-pointer transition active:scale-98 disabled:opacity-50 ${hasPasskeyLocally ? "ring-2 ring-emerald-400/40" : ""}`
    },
      React.createElement("span", { className: "text-base" }, (isWebAuthnSupported || tgBio?.isBiometricAvailable) ? "👆" : "🔢"),
      biometricLoading
        ? "Scanning Fingerprint Sensor..."
        : ((isWebAuthnSupported || tgBio?.isBiometricAvailable)
            ? (hasPasskeyLocally ? "Unlock with Registered Fingerprint" : "Unlock with Fingerprint / Passkey")
            : "Enter PIN 2743 to Unlock (or Open in Chrome for Passkeys)")
    ),

    React.createElement("div", { className: "flex items-center gap-2 w-full mb-4" },
      React.createElement("div", { className: `flex-1 border-t ${isDarkMode ? "border-slate-800" : "border-slate-200"}` }),
      React.createElement("span", { className: "text-[10px] font-bold uppercase tracking-wider text-slate-400 font-mono" }, "Or Enter PIN 2743"),
      React.createElement("div", { className: `flex-1 border-t ${isDarkMode ? "border-slate-800" : "border-slate-200"}` })
    ),

    // PIN Dots (4 digits)
    React.createElement("div", { className: "flex items-center gap-4 mb-5" },
      [0, 1, 2, 3].map(idx => React.createElement("div", {
        key: idx,
        className: `w-4 h-4 rounded-full transition-all duration-200 ${
          pin.length > idx
            ? "bg-blue-600 scale-125 shadow-sm shadow-blue-500/50"
            : (isDarkMode ? "bg-slate-800 border border-slate-700" : "bg-slate-200 border border-slate-300")
        }`
      }))
    ),

    authError && React.createElement("div", { className: "text-xs font-bold text-red-500 mb-4 text-center animate-shake" }, authError),

    // Numeric Keypad
    React.createElement("div", { className: "grid grid-cols-3 gap-2.5 w-full mb-3" },
      ["1", "2", "3", "4", "5", "6", "7", "8", "9", "👆", "0", "⌫"].map((keyVal) => {
        const isAction = keyVal === "👆" || keyVal === "⌫";
        return React.createElement("button", {
          key: keyVal,
          disabled: loading || biometricLoading,
          onClick: () => {
            if (keyVal === "👆") handleBiometricLogin();
            else if (keyVal === "⌫") handleBackspace();
            else handleDigit(keyVal);
          },
          className: `tap-target py-3 rounded-xl text-base font-bold transition active:scale-95 flex items-center justify-center cursor-pointer ${
            keyVal === "👆"
              ? "bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30"
              : isAction
                ? (isDarkMode ? "bg-slate-900 text-slate-400 hover:bg-slate-800" : "bg-slate-200 text-slate-600 hover:bg-slate-300")
                : (isDarkMode ? "bg-slate-900 text-white border border-slate-800 hover:bg-slate-850" : "bg-white text-slate-900 border border-slate-200 shadow-2xs hover:bg-slate-50")
          }`
        }, keyVal);
      })
    ),

    pin.length > 0 && React.createElement("button", {
      type: "button",
      onClick: () => { setPin(""); haptic("light"); },
      className: "text-[11px] text-slate-400 hover:text-slate-200 underline mb-3 transition cursor-pointer"
    }, "Clear PIN"),

    React.createElement("div", { className: "text-[10px] text-slate-500 font-mono text-center flex items-center justify-center gap-1.5" },
      React.createElement("span", { className: "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" }),
      loading ? "Verifying with Cloudflare Mesh..." : "Protected by Edge Mesh & WebAuthn Biometrics"
    )
  );
}

// ==============================================================
// MAIN USER BOT OPERATIONS DASHBOARD
// ==============================================================
function App() {
  const tg = window.Telegram?.WebApp;
  const urlParams = new URLSearchParams(window.location.search);
  const urlToken = urlParams.get("token") || urlParams.get("auth");

  const [authToken, setAuthToken] = useState(() => {
    if (urlToken) {
      try {
        sessionStorage.setItem("atf_admin_token", urlToken);
        localStorage.setItem("atf_admin_token", urlToken);
      } catch (_) {}
      return urlToken;
    }
    try {
      return sessionStorage.getItem("atf_admin_token") || localStorage.getItem("atf_admin_token") || "";
    } catch (_) {
      return "";
    }
  });

  const [isAuthenticated, setIsAuthenticated] = useState(() => Boolean(authToken));
  const [isLocked, setIsLocked] = useState(false);
  const [hasPasskey, setHasPasskey] = useState(() => {
    try { return Boolean(localStorage.getItem("admin_passkey_cred_id")); } catch (_) { return false; }
  });
  const [showPasskeyPrompt, setShowPasskeyPrompt] = useState(false);

  const [activeNavTab, setActiveNavTab] = useState("users"); // "users" | "wallets" | "broadcast" | "pools" | "economy"
  const [broadcastTarget, setBroadcastTarget] = useState("no_account"); // "no_account" | "revoked" | "all" | "active"
  const [broadcastTemplate, setBroadcastTemplate] = useState("onboard");
  const [broadcastText, setBroadcastText] = useState("");
  const [isBroadcasting, setIsBroadcasting] = useState(false);
  const [broadcastResult, setBroadcastResult] = useState(null);
  const [isScanningSessions, setIsScanningSessions] = useState(false);
  const [sessionScanResult, setSessionScanResult] = useState(null);

  const [soundEnabled, setSoundEnabled] = useState(true);

  const [isDarkMode, setIsDarkMode] = useState(() => {
    try { return localStorage.getItem("atf_admin_theme") === "dark"; } catch (_) { return true; }
  });

  useEffect(() => {
    if (isDarkMode) {
      document.documentElement.classList.add("dark");
      document.body.className = "bg-slate-950 text-white transition-colors duration-200";
    } else {
      document.documentElement.classList.remove("dark");
      document.body.className = "bg-slate-50 text-slate-900 transition-colors duration-200";
    }
  }, [isDarkMode]);

  useEffect(() => {
    if (tg) {
      tg.ready();
      tg.expand();
      try {
        tg.setHeaderColor(isDarkMode ? '#090d16' : '#f8fafc');
        tg.setBackgroundColor(isDarkMode ? '#090d16' : '#f8fafc');
      } catch (_) {}
    }
  }, [isDarkMode]);

  const CF_NODES = [
    "https://restore-agy.agorameet.workers.dev",
    "https://restore-agy.aaaai2.workers.dev",
    "https://restore-agy.aaa-bot.workers.dev",
    "https://restore-agy.aaa222.workers.dev",
    "https://restore-agy.aaaai.workers.dev"
  ];

  const fetchMeshApi = useCallback(async (path, options = {}) => {
    const isOriginWorker = window.location.hostname.includes("workers.dev");
    const primaryOrigin = isOriginWorker ? window.location.origin : CF_NODES[0];
    const candidateUrls = isOriginWorker 
      ? [primaryOrigin + path, ...CF_NODES.map(n => n + path)]
      : CF_NODES.map(n => n + path);
    
    const activeToken = authToken || (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("atf_admin_token") : "") || (typeof localStorage !== "undefined" ? localStorage.getItem("atf_admin_token") : "") || "";
    for (const url of candidateUrls) {
      try {
        const headers = {
          ...(options.headers || {}),
          "X-Telegram-Init-Data": tg?.initData || "",
          "Authorization": activeToken ? `Bearer ${activeToken}` : (tg?.initData ? `tma ${tg.initData}` : ""),
          "X-Admin-Token": activeToken || "",
          "X-Secret": activeToken || ""
        };
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        const resp = await fetch(url, { ...options, headers, signal: ctrl.signal });
        clearTimeout(timer);
        if (resp.ok) return await resp.json();
      } catch (_) {}
    }
    return null;
  }, [authToken]);

  const haptic = (style = "light") => {
    if (tg && tg.HapticFeedback) {
      try {
        if (style === "success") tg.HapticFeedback.notificationOccurred("success");
        else if (style === "warning") tg.HapticFeedback.notificationOccurred("warning");
        else if (style === "error") tg.HapticFeedback.notificationOccurred("error");
        else tg.HapticFeedback.impactOccurred(style);
      } catch (_) {}
    }
  };

  const [adminUsers, setAdminUsers] = useState([]);
  const [cryptoRates, setCryptoRates] = useState({ ton: 1.62, bnb: 750 });
  const [adminStats, setAdminStats] = useState({
    totalUsers: 0,
    totalAccounts: 0,
    activeMiners: 0,
    vipUsers: 0,
    totalPoints: 0,
    totalAds: 0,
    totalRefs: 0,
    poolsCount: 9,
    dailyBurnRate: 0
  });

  const [usersFilter, setUsersFilter] = useState("all");
  const [walletChainFilter, setWalletChainFilter] = useState("all");
  const [walletTypeFilter, setWalletTypeFilter] = useState("all");
  const [userSearchQuery, setUserSearchQuery] = useState("");
  const [actionLoadingId, setActionLoadingId] = useState(null);
  const [selectedUserDetail, setSelectedUserDetail] = useState(null);
  const [showRawJson, setShowRawJson] = useState(false);
  const [initialLoading, setInitialLoading] = useState(true);

  // Quick Points Modal
  const [grantModalUser, setGrantModalUser] = useState(null);
  const [customPointsInput, setCustomPointsInput] = useState("100");
  const [pointsModalMode, setPointsModalMode] = useState("add");
  const [dailySweepLoading, setDailySweepLoading] = useState(false);
  const [dailySweepResult, setDailySweepResult] = useState(null);

  // Toast & Sync
  const [toast, setToast] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncCountdown, setSyncCountdown] = useState(15);

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    haptic(type === "error" ? "error" : "success");
    if (soundEnabled) playSound(type === "error" ? "error" : "click");
    setTimeout(() => setToast(null), 3200);
  };

  const copyToClipboard = (text, label = "Copied to clipboard") => {
    navigator.clipboard.writeText(text).then(() => showToast(label)).catch(() => showToast("Copy failed", "error"));
  };

  const toggleTheme = () => {
    setIsDarkMode(prev => {
      const next = !prev;
      try { localStorage.setItem("atf_admin_theme", next ? "dark" : "light"); } catch (_) {}
      showToast(next ? "Dark Cyber Theme" : "Light High-Contrast", "info");
      return next;
    });
  };

  const handleLock = () => {
    setIsLocked(true);
    haptic("medium");
    if (soundEnabled) playSound("click");
    showToast("User Operations Console Locked 🔒", "info");
  };

  const handleLogout = () => {
    setAuthToken("");
    setIsAuthenticated(false);
    setIsLocked(false);
    try {
      sessionStorage.removeItem("atf_admin_token");
      localStorage.removeItem("atf_admin_token");
    } catch (_) {}
    fetchMeshApi("/api/admin/auth/logout", { method: "POST" });
    haptic("warning");
    showToast("Logged Out Successfully", "info");
  };

  // 15-Minute Auto-Lock & Inactivity Timer
  useEffect(() => {
    if (!isAuthenticated || isLocked) return;
    let timer = null;
    const resetTimer = () => {
      if (timer) clearTimeout(timer);
      timer = setTimeout(() => {
        setIsLocked(true);
        showToast("Auto-locked due to inactivity (15m) 🔒", "info");
      }, 15 * 60 * 1000);
    };
    const events = ["mousedown", "mousemove", "keydown", "touchstart", "scroll"];
    events.forEach(evt => window.addEventListener(evt, resetTimer, { passive: true }));
    resetTimer();

    const handleVisibilityChange = () => {
      if (document.hidden) {
        timer = setTimeout(() => {
          setIsLocked(true);
        }, 5 * 60 * 1000);
      } else {
        resetTimer();
      }
    };
    document.addEventListener("visibilitychange", handleVisibilityChange);

    return () => {
      if (timer) clearTimeout(timer);
      events.forEach(evt => window.removeEventListener(evt, resetTimer));
      document.removeEventListener("visibilitychange", handleVisibilityChange);
    };
  }, [isAuthenticated, isLocked]);

  // Primary Data Fetch
  const fetchStatus = useCallback(async (isManual = false) => {
    if (isManual) {
      setSyncing(true);
      haptic("medium");
      if (soundEnabled) playSound("click");
    }
    try {
      fetchMeshApi("/api/rates").then(r => {
        if (r && r.ok) {
          setCryptoRates({
            ton: parseFloat(r.ton_usd || 1.62),
            bnb: parseFloat(r.bnb_usd || 750)
          });
        }
      }).catch(() => {});

      const resUsers = await fetchMeshApi("/api/admin/users");
      if (resUsers && resUsers.ok) {
        if (resUsers.users) setAdminUsers(resUsers.users);
        if (resUsers.stats) setAdminStats(resUsers.stats);
        if (isManual) showToast("Telemetry Synced from Cloudflare & Turso!", "success");
      } else {
        if (isManual) showToast("Telemetry loaded from edge cache", "info");
      }
    } catch (_) {
      if (isManual) showToast("Edge connection error", "error");
    } finally {
      if (isManual) setSyncing(false);
      setInitialLoading(false);
      setSyncCountdown(15);
    }
  }, [fetchMeshApi, soundEnabled]);

  useEffect(() => {
    if (isAuthenticated) {
      fetchStatus(false);
      const interval = setInterval(() => {
        setSyncCountdown(prev => {
          if (prev <= 1) {
            fetchStatus(false);
            return 15;
          }
          return prev - 1;
        });
      }, 1000);
      return () => clearInterval(interval);
    }
  }, [fetchStatus, isAuthenticated]);

  // User Action Handler
  const handleUserAction = async (uid, action, payload = {}) => {
    setActionLoadingId(uid + "_" + action);
    haptic("medium");
    if (soundEnabled) playSound("click");
    try {
      const res = await fetchMeshApi("/api/admin/user-action", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid, action, ...payload })
      });
      if (res && res.ok && res.user) {
        setAdminUsers(prev => prev.map(u => String(u.user_id) === String(uid) ? res.user : u));
        if (selectedUserDetail && String(selectedUserDetail.user_id) === String(uid)) {
          setSelectedUserDetail(res.user);
        }
        let toastMsg = "Action Completed!";
        if (action === "add_points") toastMsg = `+${payload.amount} Points Credited!`;
        else if (action === "deduct_points") toastMsg = `-${payload.amount} Points Deducted!`;
        else if (action === "set_vip") toastMsg = "30-Day VIP Pass Granted!";
        else if (action === "toggle_ban" || action === "ban_user") toastMsg = res.user.is_banned ? "🚫 User Account Suspended & Banned!" : "✅ User Account Unbanned & Restored!";
        else if (action === "toggle_farming") toastMsg = res.user.farming_active ? "Mining Resumed!" : "Mining Paused!";
        showToast(toastMsg, res.user.is_banned ? "warning" : "success");
      } else {
        showToast("Action queued on edge mesh", "info");
      }
    } catch (e) {
      showToast("Error: " + e.message, "error");
    } finally {
      setActionLoadingId(null);
    }
  };

  // Daily Sweep Handler
  const handleRunDailySweep = async () => {
    setDailySweepLoading(true);
    haptic("medium");
    try {
      const res = await fetchMeshApi("/api/admin/daily-sweep?force=true", { method: "POST" });
      if (res && res.ok) {
        setDailySweepResult(res);
        showToast(`Deducted ${(res.totalDeducted || 0).toLocaleString()} Pts from paying miners!`, "success");
        fetchStatus(false);
      } else {
        showToast(res?.error || "Failed to trigger sweep", "error");
      }
    } catch (e) {
      showToast("Sweep error: " + e.message, "error");
    } finally {
      setDailySweepLoading(false);
    }
  };

  // Passkey Registration
  const registerBiometricPasskey = async () => {
    if (!window.PublicKeyCredential) {
      showToast("Passkeys/WebAuthn not supported on this device/browser", "error");
      return;
    }
    try {
      haptic("medium");
      showToast("Touch fingerprint sensor to register passkey...", "info");
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);
      const userIdBytes = new TextEncoder().encode("6727787768");

      const credential = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: {
            name: "AAA Auto User Operations",
            id: window.location.hostname
          },
          user: {
            id: userIdBytes,
            name: "arif",
            displayName: "Commander Arif"
          },
          pubKeyCredParams: [
            { alg: -7, type: "public-key" },
            { alg: -257, type: "public-key" }
          ],
          authenticatorSelection: {
            authenticatorAttachment: "platform",
            userVerification: "required",
            residentKey: "preferred"
          },
          timeout: 60000,
          attestation: "none"
        }
      });

      if (credential && credential.id) {
        const res = await fetchMeshApi("/api/admin/auth/register-passkey", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            credential_id: credential.id,
            password: "2743"
          })
        });

        if (res && res.ok) {
          try {
            localStorage.setItem("admin_passkey_cred_id", credential.id);
          } catch (_) {}
          setHasPasskey(true);
          setShowPasskeyPrompt(false);
          showToast("Fingerprint passkey registered successfully! 👆", "success");
          haptic("success");
          if (soundEnabled) playSound("success");
        } else {
          showToast(res?.error || "Failed to register passkey", "error");
          haptic("error");
        }
      }
    } catch (err) {
      if (err.name !== "NotAllowedError" && err.name !== "AbortError") {
        showToast("Passkey registration: " + err.message, "error");
        haptic("error");
      }
    }
  };

  // Session Scanner Handler
  const handleScanSessions = async () => {
    setIsScanningSessions(true);
    haptic("medium");
    showToast("Scanning user sessions via Cloudflare & Render...", "info");
    try {
      const res = await fetchMeshApi("/api/admin/session/check-all", { method: "POST" });
      if (res && res.ok) {
        setSessionScanResult(res);
        showToast(`Scan complete: ${res.valid || 0} valid, ${res.revoked || 0} revoked.`, "success");
        fetchStatus(false);
      } else {
        showToast(res?.error || "Session check failed", "error");
      }
    } catch (err) {
      showToast("Error: " + err.message, "error");
    } finally {
      setIsScanningSessions(false);
    }
  };

  // Broadcast Handler
  const handleSendBroadcast = async () => {
    if (!broadcastText.trim()) {
      showToast("Please enter a broadcast message or select a template.", "error");
      return;
    }
    setIsBroadcasting(true);
    haptic("medium");
    showToast("Broadcasting message to selected users...", "info");
    try {
      const res = await fetchMeshApi("/api/admin/broadcast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          target: broadcastTarget,
          message: broadcastText
        })
      });
      if (res && res.ok) {
        setBroadcastResult(res);
        showToast(`Broadcast delivered! Sent: ${res.sent}, Failed: ${res.failed}`, "success");
        if (soundEnabled) playSound("broadcast");
      } else {
        showToast(res?.error || "Broadcast failed", "error");
      }
    } catch (err) {
      showToast("Error: " + err.message, "error");
    } finally {
      setIsBroadcasting(false);
    }
  };

  // Export JSON Snapshot
  const exportUsersJson = () => {
    try {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(adminUsers, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "community_miners_" + new Date().toISOString().slice(0, 10) + ".json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Downloaded users JSON snapshot!");
      if (soundEnabled) playSound("success");
    } catch (err) {
      showToast("Failed to export JSON", "error");
    }
  };

  // Filtered Users List
  const filteredUsers = useMemo(() => {
    return adminUsers.filter(u => {
      if (userSearchQuery) {
        const q = userSearchQuery.toLowerCase();
        const nameMatch = `${u.first_name || ""} ${u.last_name || ""}`.toLowerCase().includes(q);
        const userMatch = (u.username || "").toLowerCase().includes(q);
        const idMatch = String(u.user_id || "").includes(q);
        const phoneMatch = (u.accounts || []).some(a => (a.phone || "").includes(q) || (a.name || "").toLowerCase().includes(q) || String(a.user_id || "").includes(q));
        const walletMatch = u.wallets && Object.values(u.wallets).some(w => (w.address || "").toLowerCase().includes(q));
        const customMatch = u.custom_wallet && u.custom_wallet.toLowerCase().includes(q);
        if (!nameMatch && !userMatch && !idMatch && !phoneMatch && !walletMatch && !customMatch) return false;
      }
      if (usersFilter === "accounts") return (u.accounts || []).length > 0;
      if (usersFilter === "wallets") return u.wallets && Object.keys(u.wallets).length > 0;
      if (usersFilter === "custom") return Boolean(u.custom_wallet || (u.custom_wallets && u.custom_wallets.length > 0));
      if (usersFilter === "vip") return u.subscription_expiry && u.subscription_expiry > Date.now();
      if (usersFilter === "active") return u.farming_active && !u.is_banned;
      if (usersFilter === "paused") return !u.farming_active && !u.is_banned;
      if (usersFilter === "low_points") return (u.points || 0) < ((u.accounts?.length || 1) * 100);
      if (usersFilter === "banned") return Boolean(u.is_banned);
      return true;
    });
  }, [adminUsers, userSearchQuery, usersFilter]);

  // Aggregated Wallets List
  const communityWallets = useMemo(() => {
    const list = [];
    adminUsers.forEach(u => {
      if (u.wallets) {
        Object.entries(u.wallets).forEach(([chain, wObj]) => {
          if (wObj && wObj.address) {
            list.push({
              user_id: u.user_id,
              user_name: `${u.first_name || "User"} ${u.last_name || ""}`.trim(),
              username: u.username,
              chain: chain.toLowerCase(),
              address: wObj.address,
              is_custom: false
            });
          }
        });
      }
      if (u.custom_wallets && u.custom_wallets.length > 0) {
        u.custom_wallets.forEach(cw => {
          list.push({
            user_id: u.user_id,
            user_name: `${u.first_name || "User"} ${u.last_name || ""}`.trim(),
            username: u.username,
            chain: (cw.chain || "ton").toLowerCase(),
            address: cw.address,
            is_custom: true
          });
        });
      } else if (u.custom_wallet) {
        const chain = u.custom_wallet.startsWith("0x") ? "evm" : "ton";
        list.push({
          user_id: u.user_id,
          user_name: `${u.first_name || "User"} ${u.last_name || ""}`.trim(),
          username: u.username,
          chain,
          address: u.custom_wallet,
          is_custom: true
        });
      }
    });

    return list.filter(w => {
      if (walletChainFilter !== "all" && w.chain !== walletChainFilter) return false;
      if (walletTypeFilter === "custom" && !w.is_custom) return false;
      if (walletTypeFilter === "bot" && w.is_custom) return false;
      if (userSearchQuery) {
        const q = userSearchQuery.toLowerCase();
        return w.address.toLowerCase().includes(q) || w.user_name.toLowerCase().includes(q) || String(w.user_id).includes(q);
      }
      return true;
    });
  }, [adminUsers, walletChainFilter, walletTypeFilter, userSearchQuery]);

  // Render Gate if not authenticated
  if (!isAuthenticated || isLocked) {
    return React.createElement(AdminAuthGate, {
      onSuccess: (token, res) => {
        setAuthToken(token);
        setIsAuthenticated(true);
        setIsLocked(false);
        try {
          sessionStorage.setItem("atf_admin_token", token);
          localStorage.setItem("atf_admin_token", token);
        } catch (_) {}
        if (res && res.has_passkey) setHasPasskey(true);
        if (typeof window !== "undefined" && window.PublicKeyCredential && !localStorage.getItem("admin_passkey_cred_id")) {
          setShowPasskeyPrompt(true);
        }
        showToast("Authenticated as Commander Arif!", "success");
        fetchStatus(true);
      },
      fetchMeshApi,
      haptic,
      showToast,
      soundEnabled,
      isDarkMode
    });
  }
