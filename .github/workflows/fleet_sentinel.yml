              f"• ⚡ **Deno Deploy Edge:** *{deno_ok}/2 Nodes Online*\n"
              f"• ▲ **Vercel Serverless:** {'✅ Online' if vercel_ok else '⚠️ Error'}\n"
              f"• 🖥️ **Render Standby:** *{render_ok}/2 Nodes Responding*\n"
              f"• 🗄️ **Supabase Postgres:** {'✅ Healthy (13/13 Accs)' if supabase_ok else '⚠️ Error'}\n"
              f"• ⚡ **Upstash Redis:** {'✅ Connected' if upstash_ok else '⚠️ Error'}\n"
              f"• 🚀 **Turso LibSQL:** {'✅ Ultra Low Latency' if turso_ok else '⚠️ Error'}\n"
              f"• ⛓️ **dRPC Private RPC:** {'✅ Fast (<100ms)' if drpc_ok else '⚠️ Error'}\n"
              f"• ⏱️ **Better Stack Uptime:** {'✅ Active (4 Monitors + HB)' if betterstack_ok else '⚠️ Error'}\n"
              f"• 🐞 **Sentry Error Interceptor:** {'✅ Active (Zero Crash Loss)' if sentry_ok else '⚠️ Error'}\n"
              f"• 💎 **TonAPI & Onchain:** {'✅ 100% Operational' if tonapi_ok else '⚠️ Partial'}\n"
              f"• 🔒 **Decentralized IPFS (Pinata):** ✅ Immutable Backups Active\n"
              f"• 🛡️ **Webshare Proxies:** ✅ 10 Isolated IPs Active\n\n"
              f"🤖 *Cloud Execution: Microsoft GitHub Actions ($0 Free Tier)*"
          )

          try:
              tg_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              payload = json.dumps({
                  "chat_id": owner_id,
                  "text": report_msg,
                  "parse_mode": "Markdown"
              }).encode("utf-8")
              req = urllib.request.Request(tg_url, data=payload, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=8) as r:
                  print("Telegram notification dispatched successfully!")
          except Exception as e:
              print(f"Telegram dispatch error: {e}")

          print("=" * 65)
          print("Audit complete.")
          EOF
