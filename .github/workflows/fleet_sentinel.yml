name: "MY AGY AI — Multi-Cloud 24/7 Autonomous Sentinel & Fleet Audit"

on:
  schedule:
    # Runs once a day (08:00 UTC) to strictly conserve GitHub Actions free-tier minutes
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  audit_fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Multi-Cloud Mesh & Infrastructure Audit
        env:
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          OWNER_ID: "6727787768"
          SECRET_KEY: "agy_cf_secret_7d36994e_2026"
          SUPABASE_URL: "https://znbbaozpevurvbfkxakz.supabase.co"
          SUPABASE_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
          UPSTASH_URL: "https://pleasant-locust-220893.upstash.io"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_TOKEN }}"
          TONAPI_KEY: "${{ secrets.TONAPI_KEY }}"
          ETHERSCAN_KEY: "${{ secrets.ETHERSCAN_KEY }}"
          TURSO_URL: "https://my-agy-fleet-db-aaa2743.aws-ap-south-1.turso.io"
          TURSO_TOKEN: "${{ secrets.TURSO_TOKEN }}"
          DRPC_KEY: "${{ secrets.DRPC_KEY }}"
          BETTERSTACK_KEY: "${{ secrets.BETTERSTACK_KEY }}"
          SENTRY_TOKEN: "${{ secrets.SENTRY_TOKEN }}"
          IPINFO_TOKEN: "${{ secrets.IPINFO_TOKEN }}"
          ALCHEMY_KEY: "${{ secrets.ALCHEMY_KEY }}"
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import urllib.request

          CF_NODES = [
              ("Cloudflare Shard 0 (aaaai2)", "https://restore-agy.aaaai2.workers.dev/api/fleet/live"),
              ("Cloudflare Shard 1 (aaa-bot)", "https://restore-agy.aaa-bot.workers.dev/api/fleet/live"),
              ("Cloudflare Shard 2 (aaa222)", "https://restore-agy.aaa222.workers.dev/api/fleet/live"),
              ("Cloudflare Shard 3 (agorameet)", "https://restore-agy.agorameet.workers.dev/api/fleet/live"),
              ("Cloudflare Shard 4 (aaaai)", "https://restore-agy.aaaai.workers.dev/api/fleet/live")
          ]
          RENDER_NODES = [
              ("Render Singapore (Node 1)", "https://my-agy-fleet-standby.onrender.com/health"),
              ("Render Frankfurt (Node 2)", "https://my-agy-fleet-standby-node2.onrender.com/health"),
              ("Render Oregon (Node 3 Standby)", "https://my-agy-fleet-standby-node3.onrender.com/health"),
              ("Render MTProto Relayer Primary", "https://atf-mtproto-relayer.onrender.com/wake")
