                      bs_data = json.loads(r.read().decode())
                      active_monitors = len(bs_data.get('data', []))
                      print(f"✅ Better Stack: ONLINE ({active_monitors} monitors tracking)")
                      betterstack_ok = True
          except Exception as e:
              print(f"❌ Better Stack error: {e}")

          # 11. Sentry Crash Interception Check
          sentry_ok = False
          try:
              sentry_req = urllib.request.Request(
                  "https://sentry.io/api/0/projects/aaa-nt/my-agy-fleet/",
                  headers={"Authorization": f"Bearer {sentry_token}", "User-Agent": "my-agy-fleet/1.0"}
              )
              with urllib.request.urlopen(sentry_req, timeout=8) as r:
                  if r.status == 200:
                      print("✅ Sentry Crash Tracking: ONLINE (Project my-agy-fleet ready)")
