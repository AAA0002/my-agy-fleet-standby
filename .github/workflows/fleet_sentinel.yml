                      blk = int(res.get('result', '0x0'), 16)
                      print(f"✅ dRPC Private RPC: ONLINE (Arbitrum Block #{blk})")
                      drpc_ok = True
          except Exception as e:
              print(f"❌ dRPC error: {e}")

          # 10. Better Stack Uptime & Dead Man's Switch Check
