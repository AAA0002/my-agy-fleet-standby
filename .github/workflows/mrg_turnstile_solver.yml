name: "MY AGY AI — 100% Cloud Turnstile Solver & Multi-Bot Auto-Farming"

on:
  schedule:
    # Runs every 12 hours (03:15 & 15:15 UTC) to conserve GitHub Actions free-tier minutes while keeping human passes fresh
    - cron: '15 */12 * * *'
  workflow_dispatch:

jobs:
  solve_and_farm_mrg:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"
            cache: "pip"

      - name: Install System Dependencies (Xvfb & Libgbm)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev

      - name: Install Python Dependencies & Patchright Stealth Engine
        run: |
          pip install --upgrade pip
          pip install patchright aiohttp requests tonsdk pynacl
          patchright install --with-deps chromium

      - name: Run 100% Cloud Turnstile Solver & Multi-Bot Farming Cycle
        env:
          UPSTASH_URL: "https://relaxing-starfish-285827.upstash.io"
          UPSTASH_TOKEN: "gQAAAAAABFyDAAIgcDI5MDYyYWZjNzYzNzk0ZmRjYjhmNTA4ZDI4ODlmODkzNw"
          ALERT_BOT_TOKEN: "8858823950:AAEdX47g7as1xLYEudfRUHaVGUdNIaU_ku8"
          OWNER_ID: "6727787768"
          WEBSHARE_KEY: "1r347t4h8dwfkpoa4ifmmyajvmu3oxyn2guzs5k0"
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" python mrg_turnstile_solver.py
