name: "MY AGY AI — 100% Cloud Turnstile Solver & Multi-Bot Auto-Farming"

on:
  # Schedule runs autonomously on public runner AAA0002/cloud-fleet-solver (unlimited free minutes).
  # Kept as workflow_dispatch here on private repo to conserve private runner minutes.
  workflow_dispatch:

jobs:
  solve_and_farm_mrg:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"
            cache: "pip"

      - name: Install System Dependencies (Xvfb & Libgbm)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev

      - name: Install & Configure Cloudflare WARP (Local SOCKS5 Proxy)
        run: |
          # Add Cloudflare official repository and install cloudflare-warp
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          # Start service and register local SOCKS5 proxy on 127.0.0.1:40000
          sudo systemctl enable --now warp-svc.service || sudo nohup warp-svc > /dev/null 2>&1 &
          sleep 4
          warp-cli --accept-tos registration new 2>/dev/null || warp-cli --accept-tos register 2>/dev/null || true
          warp-cli --accept-tos mode proxy 2>/dev/null || warp-cli --accept-tos set-mode proxy 2>/dev/null || true
          warp-cli --accept-tos proxy port 40000 2>/dev/null || warp-cli --accept-tos set-proxy-port 40000 2>/dev/null || true
          warp-cli --accept-tos connect 2>/dev/null || true
          sleep 3
          # Verify local proxy routing through Cloudflare edge network
          curl -s --socks5 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace/ || echo "WARP local proxy ready"

      - name: Install Python Dependencies & Patchright Stealth Engine
        run: |
          pip install --upgrade pip
          pip install patchright aiohttp requests tonsdk pynacl
          patchright install --with-deps chromium

      - name: Run 100% Cloud Turnstile Solver & Multi-Bot Farming Cycle
        env:
          UPSTASH_URL: "https://rich-emu-106119.upstash.io"
          UPSTASH_TOKEN: "${{ secrets.UPSTASH_TOKEN }}"
          ALERT_BOT_TOKEN: ${{ secrets.ALERT_BOT_TOKEN }}
          OWNER_ID: "6727787768"
          WEBSHARE_KEY: ${{ secrets.WEBSHARE_KEY }}
          WEBSHARE_KEY_2: ${{ secrets.WEBSHARE_KEY_2 }}
          USE_BROWSER_PROXY: "1"
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" python mrg_turnstile_solver.py
