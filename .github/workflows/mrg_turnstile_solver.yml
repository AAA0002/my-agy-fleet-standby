name: "MY AGY AI — 100% Cloud Turnstile Solver & Multi-Bot Auto-Farming"

on:
  schedule:
    # Runs every 4 hours to guarantee Turnstile human passes stay permanently active (TTL is ~6-8h)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  solve_and_farm_mrg:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"
            cache: "pip"

      - name: Install System Dependencies (Xvfb & Libgbm)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev

      - name: Install Python Dependencies & Patchright Stealth Engine
        run: |
          pip install --upgrade pip
          pip install patchright aiohttp requests tonsdk pynacl
          patchright install --with-deps chromium

      - name: Run 100% Cloud Turnstile Solver & Multi-Bot Farming Cycle
        env:
          UPSTASH_URL: "https://pleasant-locust-220893.upstash.io"
          UPSTASH_TOKEN: "gQAAAAAAA17dAAIgcDFhZmU2OTdiZjRmYmY0OTI2OTgyZTYyYjkwYWQ5ODYzZg"
          ALERT_BOT_TOKEN: "8858823950:AAEdX47g7as1xLYEudfRUHaVGUdNIaU_ku8"
          OWNER_ID: "6727787768"
          WEBSHARE_KEY: "e9lkjm26eqqah0s5zg26lk8tuiuxr9deznbp0aql"
          CAPSOLVER_KEY: ${{ secrets.CAPSOLVER_KEY }}
          TWOCAPTCHA_KEY: ${{ secrets.TWOCAPTCHA_KEY }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" python mrg_turnstile_solver.py
